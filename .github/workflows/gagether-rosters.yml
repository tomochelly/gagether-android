name: GAGETHER character roster collection
on:
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gagether-rosters.yml', 'web/ops/character-rosters/**']
permissions: {}
concurrency:
  group: gagether-character-rosters
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gagether-rosters
          key: gagether-rosters-v1-${{ github.run_id }}
          restore-keys: gagether-rosters-v1-
      - name: Install literal parser
        run: npm install --prefix "$RUNNER_TEMP/roster-parser" --no-save --no-package-lock typescript@5.9.3
      - name: Install verified image reader
        run: python -m pip install --disable-pip-version-check -r web/ops/character-rosters/enrichment/arknights/requirements.txt
      - name: Check roster collection regressions
        run: |
          python -m unittest discover -s web/ops/character-rosters/public-sources -p test_collector.py
          python -m unittest discover -s web/ops/character-rosters -p test_run.py
          python -m unittest discover -s web/ops/character-rosters/enrichment/zzz -p test_enrich.py
      - name: Collect isolated sources, validate and read back
        env:
          ROSTER_WORKDIR: ${{ runner.temp }}/gagether-rosters
          TYPESCRIPT_PATH: ${{ runner.temp }}/roster-parser/node_modules/typescript/lib/typescript.js
          GITHUB_TOKEN: ${{ github.token }}
          GAGETHER_GITHUB_READ_TOKEN: ${{ github.token }}
        run: python web/ops/character-rosters/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-collection-receipts
          path: |
            ${{ runner.temp }}/gagether-rosters/delivery.json
            ${{ runner.temp }}/gagether-rosters/public/run.json
            ${{ runner.temp }}/gagether-rosters/official/source-outcomes.json
          retention-days: 14
