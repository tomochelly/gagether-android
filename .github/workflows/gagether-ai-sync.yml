name: GAGETHER AI updates
# Kept on main so new codex/** branches inherit this caller; main pushes do not trigger it.
# ai-updates and codex/** only call the checking
# workflow pinned to main; /api/ai-sync rejects tokens from any other job (ops/AI-UPDATES.ko.md).
on:
  push:
    branches: [ai-updates, 'codex/**']
    paths: ['.gagether/updates/**']
  workflow_dispatch:
permissions: {}
concurrency:
  group: gagether-ai-sync
  cancel-in-progress: false
jobs:
  apply:
    permissions:
      contents: read
      id-token: write
    uses: tomochelly/gagether-android/.github/workflows/gagether-ai-sync-core.yml@main
