name: GAGETHER official notice and broadcast refresh
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gagether-refresh.yml']
permissions: {}
concurrency:
  group: gagether-official-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'tomochelly/gagether-android'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      id-token: write
    steps:
      - name: Refresh predefined official sources using a short-lived identity
        env:
          REFRESH_URL: https://gagether.wiki/api/fast-refresh
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          endpoint = os.environ['REFRESH_URL']
          oidc_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(endpoint, safe='')
          request = urllib.request.Request(oidc_url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)['value']
          print('::add-mask::' + token)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          request = urllib.request.Request(endpoint, data=b'', method='POST', headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
          with urllib.request.build_opener(NoRedirect).open(request, timeout=420) as response:
              result = json.load(response)
          if not result.get('ok'):
              raise RuntimeError('Official refresh did not complete')
          print(json.dumps({k: result.get(k) for k in ['ok', 'skipped', 'partial', 'noticesAdded', 'finishedAt', 'readback']}, ensure_ascii=False))
          if result.get('partial'):
              print('::warning::Some official sources could not be checked. Previous verified records were retained; see /api/fast-refresh for individual source status.')
          with urllib.request.urlopen(endpoint, timeout=30) as response:
              status = json.load(response)
          if not status.get('lastFinishedAt'):
              raise RuntimeError('Persisted refresh status is missing')
          print('Persisted refresh status verified:', status['lastFinishedAt'])
          PY
