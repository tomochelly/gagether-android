name: GAGETHER official notice and broadcast refresh
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gagether-refresh.yml']
permissions: {}
concurrency:
  group: gagether-official-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh with bounded retries and persisted outcome
        run: python3 web/ops/refresh-request.py
      - name: Deduplicated incident on total failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "GAGETHER refresh incident"' --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'GAGETHER refresh incident' --body "Refresh or verification failed. Check https://gagether.wiki/owner/operations and $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . This incident is deduplicated until resolved."
          fi
