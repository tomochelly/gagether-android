name: GAGETHER official notice and broadcast refresh
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gagether-refresh.yml', 'web/ops/game-refresh-request.py', 'web/ops/refresh-request.py']
permissions: {}
# The authenticated Site lease coalesces duplicate wake-ups with a successful
# no-op, avoiding GitHub pending-run cancellations and preserving fast/details isolation.
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Independent game notices, PVs and priority broadcasts
        env:
          GAGETHER_INCIDENT_FILE: ${{ runner.temp }}/gagether-refresh-incident.json
        run: python3 web/ops/game-refresh-request.py --mode fast
      # 2026-11-06 (owner, B2): one open issue per failure cause (and the games involved). A repeat of
      # the same cause adds a comment with this run's link instead of disappearing into an old issue.
      # Only cause classes, public game IDs/lanes and the run link are written.
      - name: Incident issue per failure cause
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_FILE: ${{ runner.temp }}/gagether-refresh-incident.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -s "$INCIDENT_FILE" ]; then incidents=$(jq -c '.incidents[]' "$INCIDENT_FILE"); else incidents='{"cause":"runner","label":"runner","games":[],"tasks":[]}'; fi
          printf '%s\n' "$incidents" | while IFS= read -r incident; do
            title=$(jq -r '"GAGETHER refresh incident: "+.label+(if (.games|length)>0 then " · "+(.games|join(", ")) else "" end)' <<<"$incident")
            tasks=$(jq -r 'if (.tasks|length)>0 then (.tasks|join(", ")) else "-" end' <<<"$incident")
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title | jq -r --arg t "$title" '[.[]|select(.title==$t)][0].number // empty')
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "같은 원인으로 다시 실패했습니다. 작업: $tasks. 실행: $RUN_URL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "refresh 실행이 이 원인으로 실패했습니다. 작업: $tasks. 실행: $RUN_URL. 같은 원인이 반복되면 이 이슈에 실행 링크가 댓글로 붙습니다. 원인이 해결되면 이 이슈를 닫습니다."
            fi
          done
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Independent low-priority game details and maintenance
        run: python3 web/ops/game-refresh-request.py --mode details --once
