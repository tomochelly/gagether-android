name: GAGETHER deployed source drift check
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**']
permissions:
  contents: read
  issues: write
concurrency:
  group: gagether-source-drift
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime code and pinned canonical data identity
        run: python3 web/ops/check-source-mirror.py
      - name: Deduplicated source drift incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "GAGETHER source drift"' --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'GAGETHER source drift' --body "GitHub and deployed Site source differ or verification failed. Reconcile before release. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
