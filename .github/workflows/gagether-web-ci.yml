name: GAGETHER web source checks
on:
  push:
    paths: ['web/**']
  pull_request:
    paths: ['web/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: node --test --test-concurrency=2 tests/*.test.mjs
        working-directory: web
      - run: node scripts/validate-editor.mjs
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
      - run: python3 -m unittest discover -s ops -p 'test_*.py'
        working-directory: web
      - run: python3 -m unittest discover -s ops/character-rosters/enrichment -p 'test_*.py'
        working-directory: web
      - run: python3 -m pip install --disable-pip-version-check -r ops/character-rosters/enrichment/zzz/requirements.txt
        working-directory: web
      - run: python3 -m unittest discover -s ops/character-rosters/enrichment/zzz -p 'test_*.py'
        working-directory: web
