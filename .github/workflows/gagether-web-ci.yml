name: GAGETHER web source checks
on:
  push:
    paths: ['web/**']
  pull_request:
    paths: ['web/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: node --test tests/service-reliability.test.mjs tests/editor-artwork.test.mjs tests/upcoming-pickups.test.mjs
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
