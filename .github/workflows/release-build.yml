name: Build signed release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [GAGETHER Android runtime checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-release
    env:
      GAGETHER_KEYSTORE_PASSWORD: ${{ secrets.GAGETHER_KEYSTORE_PASSWORD }}
      GAGETHER_KEY_ALIAS: ${{ secrets.GAGETHER_KEY_ALIAS }}
      GAGETHER_KEY_PASSWORD: ${{ secrets.GAGETHER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Set temporary signing key path
        run: printf 'GAGETHER_KEYSTORE_FILE=%s/gagether-upload.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Load owner-managed signing key
        env:
          GAGETHER_KEYSTORE_BASE64: ${{ secrets.GAGETHER_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$GAGETHER_KEYSTORE_BASE64" || { echo 'Configure android-release signing secrets first.'; exit 1; }
          test -n "$GAGETHER_KEYSTORE_PASSWORD"
          test -n "$GAGETHER_KEY_ALIAS"
          test -n "$GAGETHER_KEY_PASSWORD"
          umask 077
          printf '%s' "$GAGETHER_KEYSTORE_BASE64" | base64 --decode > "$GAGETHER_KEYSTORE_FILE"
      - name: Test and build release APK and AAB
        run: bash ./gradlew --no-daemon -PrequireReleaseSigning=true :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Publish the requested update after runtime verification
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUNTIME_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/publish-release.py
      - name: Remove temporary key
        if: always()
        run: rm -f -- "$GAGETHER_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v7
        with:
          name: signed-release-for-review
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      # Manual dispatch remains build-only. The requested GitHub APK update publishes only after trusted main-branch runtime tests and certificate continuity checks.
